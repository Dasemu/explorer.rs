# SPDX-License-Identifier: GPL-3.0-or-later
# Fuzz targets (cargo-fuzz, nightly). Not part of the workspace.
#   rustup toolchain install nightly
#   cargo install cargo-fuzz --locked
#   cargo +nightly fuzz run snapshot -- -max_total_time=60
[package]
name = "explorer-index-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "GPL-3.0-or-later"

[package.metadata]
cargo-fuzz = true

# Stand-alone workspace (the repository workspace excludes this directory).
[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
explorer-index = { path = "../crates/explorer-index" }

[[bin]]
name = "snapshot"
path = "fuzz_targets/snapshot.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ipc"
path = "fuzz_targets/ipc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "records"
path = "fuzz_targets/records.rs"
test = false
doc = false
bench = false

[[bin]]
name = "query"
path = "fuzz_targets/query.rs"
test = false
doc = false
bench = false
