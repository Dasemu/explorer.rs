# explorer.rs default configuration.
#
# Copy this file to %APPDATA%\explorer-rs\config.toml and edit it.
# Every key is optional: missing keys fall back to the values shown here.
# Unknown keys are rejected so typos are reported in the log instead of
# being silently ignored.

[general]
# Log verbosity: "error", "warn", "info", "debug" or "trace".
# The EXPLORER_RS_LOG environment variable overrides this (tracing filter syntax).
log_level = "info"
# How many rotated daily log files to keep per component.
log_keep_files = 7
# Colours: "system" (follow Windows light/dark mode and accent colour),
# "dark" or "light".
theme = "system"

[taskbar]
# Screen edge: "bottom" or "top".
position = "bottom"
# "system" follows Settings > Personalization > Taskbar > Taskbar alignment;
# "center" or "left" force it.
alignment = "system"
# Show window titles next to icons (false = icon-only, like Windows 11).
button_labels = false
# Height in logical pixels (scaled by the monitor DPI).
height = 48
# Which monitors get a taskbar: "all" or "primary".
monitors = "all"
# Only show windows that live on the taskbar's own monitor.
windows_on_own_monitor_only = false
# Width of a labelled window button in logical pixels (button_labels = true).
button_width = 180
# Show the clock.
show_clock = true
# strftime-like clock format. Supported: %H %M %S %I %p %d %m %Y %a %b.
clock_format = "%H:%M"
# Second line of the clock; empty string disables it.
date_format = "%d/%m/%Y"
# Window classes that must never appear on the taskbar (exact match).
exclude_classes = []
# Executable file names that must never appear on the taskbar (case-insensitive).
exclude_processes = []

[tray]
# Show the notification area (system tray) on the primary monitor's taskbar.
enabled = true
# Dev mode only: put our tray window in front of explorer.exe's so we receive
# tray icons too. Every message is forwarded to explorer.exe, which keeps
# working normally. Set to false if tray icons misbehave.
intercept_in_dev_mode = true

[launcher]
# Open the launcher when the Windows key is pressed and released alone.
win_key_opens_launcher = true
# Maximum number of results shown.
max_results = 12
# Extra folders scanned for shortcuts (.lnk, .url, .exe), in addition to
# shell:AppsFolder (which already includes the Start Menu).
extra_folders = []
# Width/height of the Start menu in logical pixels.
width = 640
height = 720

[launcher.everything]
# File search through the Everything SDK (voidtools). Requires the binary to
# be built with `--features everything` AND Everything to be running.
enabled = false
max_results = 5

[supervisor]
# Delay before the first restart of a crashed component (milliseconds).
restart_initial_delay_ms = 500
# Upper bound of the exponential restart backoff (milliseconds).
restart_max_delay_ms = 30000
# A component that crashes more than `crash_loop_max` times within
# `crash_loop_window_s` seconds is given up on until the supervisor restarts.
crash_loop_max = 5
crash_loop_window_s = 60
# Components to run. Remove one to disable it. Known components:
# "taskbar", "launcher", "indexd" (file-name index daemon; not enabled by
# default until verified on Windows, see docs/INDEX.md).
components = ["taskbar", "launcher"]

[index]
# Settings of the file-name index daemon (explorer-rs-indexd).
# Folders or volumes to index, e.g. ["C:\\", "D:\\Data"]. Empty means every
# fixed local volume on Windows (the home directory on other systems).
roots = []
# Read the NTFS master file table and follow the USN change journal. This
# needs the elevated helper (docs/decisions/0010-index-privilege-model.md).
# Without it, folders are walked and watched instead (slower start-up).
use_ntfs = true
# Names never indexed (case-insensitive; `*` wildcards allowed).
exclude_names = ["$Recycle.Bin", "System Volume Information", "$WinREAgent"]
# Path prefixes never indexed (case-insensitive), e.g. ["C:\\Windows\\WinSxS"].
exclude_paths = []
# Hide results inside folders the current user cannot list. An MFT index
# sees every file name on the volume regardless of permissions.
check_access = true
# Seconds between periodic snapshot saves (0 = only on shutdown).
snapshot_interval_s = 600
# Seconds between full rescans of walked roots that cannot be watched (0 = never).
rescan_interval_s = 3600
# Largest page a client may request in one query.
max_query_results = 1000
# Number of "Files" results in the launcher (needs the `file-index` feature).
launcher_results = 5
