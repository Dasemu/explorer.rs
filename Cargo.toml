# SPDX-License-Identifier: GPL-3.0-or-later
[workspace]
resolver = "2"
members = [
    "crates/explorer-core",
    "crates/explorer-win",
    "crates/explorer-taskbar",
    "crates/explorer-launcher",
    "crates/explorer-supervisor",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/Dasemu/explorer.rs"
rust-version = "1.85"

[workspace.dependencies]
explorer-core = { path = "crates/explorer-core" }
explorer-win = { path = "crates/explorer-win" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
nucleo-matcher = "0.3"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
windows = "0.62"
winvd = "0.0.49"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
panic = "unwind"
